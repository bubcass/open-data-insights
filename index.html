<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insights | Parliamentary visual data</title>
    <meta
      name="description"
      content="Visual insight into the work of the Houses of the Oireachtas"
    />
    <script>
      (() => {
        const key = "oireachtas-insights-theme";
        const legacyKey = "open-data-insights-theme";
        try {
          let theme = localStorage.getItem(key);
          if (theme !== "dark" && theme !== "light") {
            theme = localStorage.getItem(legacyKey);
            if (theme === "dark" || theme === "light") localStorage.setItem(key, theme);
          }
          document.documentElement.dataset.theme =
            theme === "dark" || theme === "light"
              ? theme
              : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch {
          document.documentElement.dataset.theme =
            matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
      })();
    </script>
    <script type="module" crossorigin src="/open-data-insights/assets/index-D9wNgexk.js"></script>
    <link rel="stylesheet" crossorigin href="/open-data-insights/assets/index-tcKJ3EkY.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
